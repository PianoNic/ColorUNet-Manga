[project]
name = "colorunet-manga-training"
version = "0.1.0"
description = "Training, export and evaluation for ColorUNet-Manga, a fast single-pass manga page colorizer"
requires-python = ">=3.11"
license = "MIT"
# torch is installed separately (CUDA build on GPUs, CPU wheel in CI), see README.md.
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "timm>=1.0",
]

[project.optional-dependencies]
export = ["onnx>=1.16", "onnxscript>=0.1", "onnxruntime>=1.18"]
data = ["resvg-py>=0.1"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["work", "runs", "checkpoints", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B023",   # loop-variable closures are called within the same iteration
    "E501",   # long comments and docstrings; code lines are wrapped by ruff format
    "E402",   # scripts put the project root on sys.path before importing it
    "E731",   # small lambdas are clearer inline here
    "E741",   # L (lightness) is the standard name
    "B905",   # zip(strict=) adds noise for same-length lists built right there
    "UP031",  # %-formatting in a few log lines is fine
]

[tool.ruff.lint.isort]
known-first-party = ["models", "scripts", "data", "eval", "export"]

[tool.ruff.format]
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
