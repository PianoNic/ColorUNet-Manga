name: Training CI

on:
  pull_request:
    paths:
      - 'training/**'
      - '.github/workflows/training-ci.yml'
  push:
    branches: [main]
    paths:
      - 'training/**'
      - '.github/workflows/training-ci.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: training
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: training/requirements*.txt

      - name: Install CPU torch and requirements
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Ruff
        run: |
          ruff check .
          ruff format --check .

      # tests/test_lightness.py skips itself here: it needs CUDA, the trained weights and test pages.
      - name: Pytest
        run: pytest -ra
