<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>WebGPU colorizer test</title>
<style>
  body { font: 14px system-ui, sans-serif; margin: 16px; background: #111; color: #eee; }
  #log { white-space: pre-wrap; font-family: ui-monospace, monospace; background: #000; padding: 10px; border-radius: 6px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .row img, .row canvas { max-height: 80vh; max-width: 48vw; background: #fff; }
  button, select { font: inherit; padding: 6px 12px; }
</style>
</head>
<body>
<h1>WebGPU colorizer test</h1>
<p>Serve the repo root (<code>python -m http.server 8765</code>) and open <code>/eval/web/</code>.</p>
<label>Model <select id="model"><option value="fp16">fp16 (61 MB)</option><option value="fp32">fp32 (122 MB)</option></select></label>
<label>Page <select id="page">
  <option>ch0114.0_p013.png</option><option>ch0114.0_p003.png</option><option>ch0115.5_p012.png</option>
</select></label>
<button id="run">Run</button>
<div id="log"></div>
<div class="row"><img id="src" alt="" /><canvas id="out"></canvas></div>
<script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.webgpu.min.js"></script>
<script>
const log = (s) => { document.getElementById('log').textContent += s + '\n'; console.log('[colorizer] ' + s) }
const sessions = {}

async function session(kind) {
  if (sessions[kind]) return sessions[kind]
  const t = performance.now()
  sessions[kind] = await ort.InferenceSession.create(`../../export/web/colorizer-${kind}.onnx`, {
    executionProviders: ['webgpu'], graphOptimizationLevel: 'all',
  })
  log(`${kind}: session created in ${(performance.now() - t).toFixed(0)} ms (download + compile)`)
  return sessions[kind]
}

function grayPixels(img, w, h) {
  const c = new OffscreenCanvas(w, h)
  const ctx = c.getContext('2d', { willReadFrequently: true })
  ctx.imageSmoothingQuality = 'high'
  ctx.drawImage(img, 0, 0, w, h)
  const d = ctx.getImageData(0, 0, w, h).data
  const out = new Float32Array(w * h)
  for (let i = 0, j = 0; j < out.length; i += 4, j++) out[j] = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) / 255
  return out
}

async function run() {
  const kind = document.getElementById('model').value
  const name = document.getElementById('page').value
  if (!navigator.gpu) { log('no WebGPU in this browser'); return }
  const adapter = await navigator.gpu.requestAdapter()
  log(`adapter: ${adapter?.info?.vendor ?? '?'} ${adapter?.info?.architecture ?? ''}, shader-f16: ${adapter?.features.has('shader-f16')}`)
  const img = document.getElementById('src')
  img.src = `../testset/more-than-a-doll/${name}`
  await img.decode()
  const W = img.naturalWidth, H = img.naturalHeight
  const s = 768 / Math.max(W, H)
  const w = Math.max(32, Math.round((W * s) / 32) * 32), h = Math.max(32, Math.round((H * s) / 32) * 32)
  const sess = await session(kind)
  for (let rep = 0; rep < 3; rep++) {
    const t0 = performance.now()
    const gray = new ort.Tensor('float32', grayPixels(img, W, H), [1, 1, H, W])
    const small = new ort.Tensor('float32', grayPixels(img, w, h), [1, 1, h, w])
    const t1 = performance.now()
    const { rgb } = await sess.run({ gray, small })
    const t2 = performance.now()
    const px = new Uint8ClampedArray(W * H * 4), d = rgb.data, n = W * H
    for (let i = 0; i < n; i++) {
      px[4 * i] = d[i] * 255; px[4 * i + 1] = d[n + i] * 255; px[4 * i + 2] = d[2 * n + i] * 255; px[4 * i + 3] = 255
    }
    const cv = document.getElementById('out'); cv.width = W; cv.height = H
    cv.getContext('2d').putImageData(new ImageData(px, W, H), 0, 0)
    const t3 = performance.now()
    log(`${kind} ${name} ${W}x${H} run ${rep + 1}: prep ${(t1 - t0).toFixed(0)} ms, model+merge ${(t2 - t1).toFixed(0)} ms, draw ${(t3 - t2).toFixed(0)} ms, total ${(t3 - t0).toFixed(0)} ms`)
  }
}
document.getElementById('run').onclick = () => run().catch((e) => log('ERROR ' + (e?.stack || e)))
</script>
</body>
</html>
